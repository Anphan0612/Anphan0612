<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1000 32" width="1000" height="32">
  <title id="title">Matrix divider</title>
  <desc id="description">A thin monochrome line with subtle binary decoration.</desc>

  <rect width="1000" height="32" rx="16" fill="#070707" />
  <line x1="24" y1="16" x2="976" y2="16" stroke="#3f3f3f" stroke-width="1" />
  <line x1="24" y1="15" x2="430" y2="15" stroke="#1f1f1f" />
  <line x1="570" y1="17" x2="976" y2="17" stroke="#1f1f1f" />

  <g fill="#9b9b9b" font-family="SFMono-Regular, Consolas, monospace" font-size="9" opacity="0.65">
    <text x="34" y="20">0 1 0</text>
    <text x="155" y="20">1 0 1</text>
    <text x="816" y="20">1 1 0</text>
    <text x="937" y="20">0 0 1</text>
  </g>

  <rect x="466" y="7" width="68" height="18" rx="9" fill="#0c0c0c" stroke="#4a4a4a" />
  <text x="500" y="19" text-anchor="middle" fill="#ffffff" font-family="SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="2">//</text>
</svg>
