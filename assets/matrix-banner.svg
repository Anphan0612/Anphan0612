<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1000 240" width="1000" height="240">
  <title id="title">An Phan — Backend Development</title>
  <desc id="description">A monochrome Matrix-inspired banner featuring An Phan and the subtitle Backend Development.</desc>

  <defs>
    <clipPath id="frame">
      <rect width="1000" height="240" rx="16" />
    </clipPath>
    <style>
      .label,
      .subtitle,
      .name,
      .rain {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      .label {
        fill: #9b9b9b;
        font-size: 11px;
        letter-spacing: 2px;
      }

      .name {
        fill: #ffffff;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: 7px;
      }

      .subtitle {
        fill: #d0d0d0;
        font-size: 13px;
        letter-spacing: 4px;
      }

      .rain {
        fill: #ffffff;
        font-size: 12px;
        letter-spacing: 2px;
        opacity: 0.12;
        animation: fall 8s linear infinite;
      }

      .rain.dim {
        opacity: 0.07;
        animation-duration: 12s;
      }

      .rain.alt {
        animation-duration: 10s;
        animation-delay: -4s;
      }

      @keyframes fall {
        from {
          transform: translateY(-180px);
        }
        to {
          transform: translateY(180px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .rain {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="1000" height="240" rx="16" fill="#070707" />
  <g clip-path="url(#frame)">
    <rect x="22" y="22" width="956" height="196" rx="12" fill="none" stroke="#2e2e2e" />
    <path d="M70 46V194M930 46V194" stroke="#3a3a3a" stroke-width="1" opacity="0.7" />

    <g class="rain" aria-hidden="true">
      <text x="42" y="22">0</text><text x="42" y="42">1</text><text x="42" y="62">0</text>
      <text x="42" y="82">1</text><text x="42" y="102">1</text><text x="42" y="122">0</text>
      <text x="42" y="142">1</text><text x="42" y="162">0</text><text x="42" y="182">1</text>
      <text x="78" y="8">1</text><text x="78" y="28">0</text><text x="78" y="48">1</text>
      <text x="78" y="68">0</text><text x="78" y="88">0</text><text x="78" y="108">1</text>
      <text x="78" y="128">0</text><text x="78" y="148">1</text><text x="78" y="168">1</text>
      <text x="958" y="18">1</text><text x="958" y="38">0</text><text x="958" y="58">1</text>
      <text x="958" y="78">1</text><text x="958" y="98">0</text><text x="958" y="118">0</text>
      <text x="958" y="138">1</text><text x="958" y="158">0</text><text x="958" y="178">1</text>
      <text x="922" y="6">0</text><text x="922" y="26">1</text><text x="922" y="46">0</text>
      <text x="922" y="66">1</text><text x="922" y="86">0</text><text x="922" y="106">1</text>
      <text x="922" y="126">1</text><text x="922" y="146">0</text><text x="922" y="166">0</text>
    </g>

    <g class="rain dim alt" aria-hidden="true">
      <text x="245" y="12">1</text><text x="245" y="32">0</text><text x="245" y="52">1</text>
      <text x="245" y="72">0</text><text x="245" y="92">1</text><text x="245" y="112">0</text>
      <text x="245" y="132">1</text><text x="245" y="152">0</text><text x="245" y="172">1</text>
      <text x="285" y="0">0</text><text x="285" y="20">1</text><text x="285" y="40">1</text>
      <text x="285" y="60">0</text><text x="285" y="80">1</text><text x="285" y="100">0</text>
      <text x="285" y="120">1</text><text x="285" y="140">1</text><text x="285" y="160">0</text>
      <text x="715" y="10">0</text><text x="715" y="30">1</text><text x="715" y="50">0</text>
      <text x="715" y="70">1</text><text x="715" y="90">0</text><text x="715" y="110">1</text>
      <text x="715" y="130">1</text><text x="715" y="150">0</text><text x="715" y="170">1</text>
      <text x="755" y="0">1</text><text x="755" y="20">0</text><text x="755" y="40">1</text>
      <text x="755" y="60">1</text><text x="755" y="80">0</text><text x="755" y="100">1</text>
      <text x="755" y="120">0</text><text x="755" y="140">1</text><text x="755" y="160">0</text>
    </g>

    <g class="rain dim" aria-hidden="true">
      <text x="145" y="10">+</text><text x="145" y="30">0</text><text x="145" y="50">1</text>
      <text x="145" y="70">/</text><text x="145" y="90">0</text><text x="145" y="110">1</text>
      <text x="145" y="130">+</text><text x="145" y="150">1</text><text x="145" y="170">0</text>
      <text x="855" y="8">1</text><text x="855" y="28">/</text><text x="855" y="48">0</text>
      <text x="855" y="68">1</text><text x="855" y="88">+</text><text x="855" y="108">0</text>
      <text x="855" y="128">1</text><text x="855" y="148">0</text><text x="855" y="168">/</text>
    </g>

    <rect x="118" y="54" width="764" height="132" rx="12" fill="#0c0c0c" stroke="#454545" />
    <path d="M154 91H846M154 153H846" stroke="#272727" stroke-width="1" />
    <circle cx="144" cy="91" r="3" fill="#bdbdbd" />
    <circle cx="856" cy="153" r="3" fill="#bdbdbd" />
  </g>

  <text class="label" x="70" y="40">PROFILE / BACKEND FOCUS</text>
  <text class="label" x="930" y="40" text-anchor="end">JAVA · DOTNET</text>
  <text class="name" x="500" y="129" text-anchor="middle">AN PHAN</text>
  <text class="subtitle" x="500" y="168" text-anchor="middle">BACKEND DEVELOPMENT</text>
</svg>
